title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: "Thanks for asking. Please do not paste keys, tokens or personal data."
  - type: input
    id: client
    attributes:
      label: MCP client
      description: "For example Cursor or VS Code, with its version."
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What you asked or tried
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
